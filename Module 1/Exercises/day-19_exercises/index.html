<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 19 DOM Events Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="title">Original Heading</h1>

    <h2>Ethiopian Cities</h2>
    <ul id="cityList"></ul>

    <h2>Event Bubbling</h2>
    <div id="buttonContainer">
        <button id="myButton">Click Me</button>
    </div>

    <h2>Delete Items</h2>
    <ul id="itemList">
        <li>Item 1 <button class="delete-btn">Delete</button></li>
        <li>Item 2 <button class="delete-btn">Delete</button></li>
        <li>Item 3 <button class="delete-btn">Delete</button></li>
    </ul>

    <h2>Add an Item</h2>
    <form id="itemForm">
        <input type="text" id="itemInput" placeholder="Enter an item">
        <button type="submit">Add Item</button>
    </form>

    <ul id="newItemsList"></ul>

    <script src="script.js"></script>
</body>
</html>
